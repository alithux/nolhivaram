<!DOCTYPE html>
<html lang="en">
<head>

<title>HDh. Nolhivaram — Phase 3</title>
<style>

  html,body { margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);

  #game-canvas { display:block; width:100%; height:100%; touch-action:none; outline:none; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;

  .overlay.hidden { display:none; }
  .card { text-align:center; padding:2rem 3rem; border-radius:12px;

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.0/build/three.module.js",

<body>
<div id="app">
  <canvas id="game-canvas"></canvas>

  <div id="loading-screen" class="overlay">
    <div class="card">
      <h1>HDh. Nolhivaram</h1>
      <div class="loading-bar"><div id="loading-fill"></div></div>
      <p id="loading-text">Loading… 0%</p>
    </div>
  </div>

  <div id="mobile-controls" class="hidden"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* --------------------------------------------------------------------------
   CONFIG
-------------------------------------------------------------------------- */
const CONFIG = {
  DAY_LENGTH_SECONDS: 600,
  START_TIME_OF_DAY: 0.34,
  ISLAND: { RADIUS: 90, PLANE_SIZE: 240, SEGMENTS: 160, MAX_HEIGHT: 8.0 },
  OCEAN:  { SIZE: 800, SEGMENTS: 128 },
  RENDERER: { MAX_PIXEL_RATIO: 2, SHADOW_MAP_SIZE: 2048 },
  CAMERA: { FOV: 70, NEAR: 0.1, FAR: 1000, START: { x: 0, y: 40, z: 90 } },
};

const IS_MOBILE = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

/* --------------------------------------------------------------------------
   SCENE MANAGER
-------------------------------------------------------------------------- */
class SceneManager {
  constructor(canvas) {
    this.canvas = canvas;
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0xa9d7e8, 0.0045);

    this.camera = new THREE.PerspectiveCamera(CONFIG.CAMERA.FOV,
      innerWidth / innerHeight, CONFIG.CAMERA.NEAR, CONFIG.CAMERA.FAR);
    this.camera.position.set(CONFIG.CAMERA.START.x, CONFIG.CAMERA.START.y, CONFIG.CAMERA.START.z);

    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_MOBILE, powerPreference: 'high-performance' });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, CONFIG.RENDERER.MAX_PIXEL_RATIO));
    this.renderer.setSize(innerWidth, innerHeight);
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.0;
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    this.clock = new THREE.Clock();
    this.updaters = [];
    this.running = false;
    this.fpsSamples = [];

    addEventListener('resize', () => this._onResize());
    this._onResize();
  }
  _onResize() {
    this.camera.aspect = innerWidth / innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(innerWidth, innerHeight);
  }
  registerUpdate(fn) {
    this.updaters.push(fn);
    return () => { const i = this.updaters.indexOf(fn); if (i !== -1) this.updaters.splice(i, 1); };
  }
  start() { if (this.running) return; this.running = true; this.clock.start(); this._loop(); }
  _loop() {
    if (!this.running) return;
    requestAnimationFrame(() => this._loop());
    const dt = Math.min(this.clock.getDelta(), 0.1);
    const elapsed = this.clock.elapsedTime;
    for (const fn of this.updaters) fn(dt, elapsed);
    this.renderer.render(this.scene, this.camera);
    if (dt > 0) this.fpsSamples.push(1 / dt);
    if (this.fpsSamples.length > 60) this.fpsSamples.shift();
  }
  getAverageFPS() {
    if (!this.fpsSamples.length) return 0;
    return this.fpsSamples.reduce((a, b) => a + b, 0) / this.fpsSamples.length;
  }
}

/* --------------------------------------------------------------------------
   SKY (gradient dome)
-------------------------------------------------------------------------- */
class Sky {
  constructor(scene) {
    const vert = `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`;
    const frag = `
      varying vec3 vWorldPos;
      uniform vec3 topColor, horizonColor, bottomColor;
      uniform float exponent;
      void main() {
        vec3 dir = normalize(vWorldPos);
        float h = dir.y;
        float t = pow(max(h, 0.0), exponent);
        vec3 sky = mix(horizonColor, topColor, t);
        float b = clamp(-h * 1.2, 0.0, 1.0);
        sky = mix(sky, bottomColor, b);
        gl_FragColor = vec4(sky, 1.0);
      }`;
    this.material = new THREE.ShaderMaterial({
      vertexShader: vert, fragmentShader: frag, side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        topColor:     { value: new THREE.Color(0x2a6fbf) },
        horizonColor: { value: new THREE.Color(0xbcd9f0) },
        bottomColor:  { value: new THREE.Color(0x1a2233) },
        exponent:     { value: 0.65 },
      },
    });
    this.mesh = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), this.material);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = -1000;
    this.mesh.name = 'Sky';
    scene.add(this.mesh);
  }
  setColors({ top, horizon, bottom }) {
    if (top)     this.material.uniforms.topColor.value.copy(top);
    if (horizon) this.material.uniforms.horizonColor.value.copy(horizon);
    if (bottom)  this.material.uniforms.bottomColor.value.copy(bottom);
  }
}

/* --------------------------------------------------------------------------
   OCEAN (shader)
-------------------------------------------------------------------------- */
class Ocean {
  constructor(scene, { shallowRadius = 55, deepRadius = 130 } = {}) {
    const vert = `
      uniform float uTime;
      varying vec3 vWorldPos; varying vec3 vNormal; varying float vWave;
      float w(vec2 p, vec2 dir, float freq, float amp, float speed) {
        return sin(dot(p, dir) * freq + uTime * speed) * amp;
      }
      float sumWaves(vec2 p) {
        float h = 0.0;
        h += w(p, normalize(vec2( 1.0,  0.3)), 0.15, 0.35, 1.2);
        h += w(p, normalize(vec2(-0.4,  1.0)), 0.22, 0.18, 1.6);
        h += w(p, normalize(vec2( 0.7, -0.6)), 0.40, 0.08, 2.4);
        return h;
      }
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vec2 p = worldPos.xz;
        float h = sumWaves(p);
        worldPos.y += h;
        vWave = h;
        vWorldPos = worldPos.xyz;
        float e = 0.6;
        float hx = sumWaves(p + vec2(e, 0.0));
        float hz = sumWaves(p + vec2(0.0, e));
        vNormal = normalize(vec3(-(hx - h) / e, 1.0, -(hz - h) / e));
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }`;
    const frag = `
      uniform vec3 uDeepColor, uShallowColor, uFoamColor, uSunDir, uSunColor, uFogColor;
      uniform float uFogDensity, uShallowRadius, uDeepRadius;
      varying vec3 vWorldPos; varying vec3 vNormal; varying float vWave;
      void main() {
        vec3 viewDir = normalize(cameraPosition - vWorldPos);
        vec3 n = normalize(vNormal);
        float dist = length(vWorldPos.xz);
        float shallowT = smoothstep(uShallowRadius, uDeepRadius, dist);
        shallowT = 1.0 - shallowT;
        vec3 baseColor = mix(uDeepColor, uShallowColor, shallowT);
        float fres = pow(1.0 - max(dot(n, viewDir), 0.0), 3.0);
        baseColor = mix(baseColor, vec3(0.75, 0.88, 0.95), fres * 0.45);
        vec3 hv = normalize(uSunDir + viewDir);
        float spec = pow(max(dot(n, hv), 0.0), 90.0) * 0.9;
        float foam = smoothstep(0.55, 0.85, shallowT + vWave * 0.6);
        vec3 color = baseColor + spec * uSunColor;
        color = mix(color, uFoamColor, foam * 0.35);
        float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity *
                          dot(vWorldPos - cameraPosition, vWorldPos - cameraPosition));
        color = mix(color, uFogColor, clamp(fogFactor, 0.0, 1.0));
        gl_FragColor = vec4(color, 1.0);
      }`;
    const geo = new THREE.PlaneGeometry(CONFIG.OCEAN.SIZE, CONFIG.OCEAN.SIZE,
      CONFIG.OCEAN.SEGMENTS, CONFIG.OCEAN.SEGMENTS);
    geo.rotateX(-Math.PI / 2);
    this.material = new THREE.ShaderMaterial({
      vertexShader: vert, fragmentShader: frag,
      uniforms: {
        uTime:          { value: 0 },
        uDeepColor:     { value: new THREE.Color(0x0b3a5b) },
        uShallowColor:  { value: new THREE.Color(0x35c1c9) },
        uFoamColor:     { value: new THREE.Color(0xeaf6ff) },
        uSunDir:        { value: new THREE.Vector3(0, 1, 0) },
        uSunColor:      { value: new THREE.Color(0xfff0c0) },
        uFogColor:      { value: new THREE.Color(0xa9d7e8) },
        uFogDensity:    { value: 0.0045 },
        uShallowRadius: { value: shallowRadius },
        uDeepRadius:    { value: deepRadius },
      },
    });
    this.mesh = new THREE.Mesh(geo, this.material);
    this.mesh.name = 'Ocean';
    scene.add(this.mesh);
  }
  update(dt, elapsed, sunDir, sunColor) {
    this.material.uniforms.uTime.value = elapsed;
    if (sunDir)   this.material.uniforms.uSunDir.value.copy(sunDir).normalize();
    if (sunColor) this.material.uniforms.uSunColor.value.copy(sunColor);
  }
  syncFog(fog) {
    if (!fog) return;
    this.material.uniforms.uFogColor.value.copy(fog.color);
    this.material.uniforms.uFogDensity.value = fog.density ?? 0.0045;
  }
}

/* --------------------------------------------------------------------------
   ISLAND (procedural teardrop)
-------------------------------------------------------------------------- */
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return s - Math.floor(s); }
function valueNoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a*(1-ux)*(1-uy) + b*ux*(1-uy) + c*(1-ux)*uy + d*ux*uy;
}
function fbm(x, y, oct = 4) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < oct; i++) { v += amp * valueNoise(x * freq, y * freq); amp *= 0.5; freq *= 2; }
  return v;
}
function shapeRadius(a, R) {
  return R * (1.0 + 0.28 * Math.cos(a - 0.6) + 0.14 * Math.cos(2 * a + 1.1));
}
function islandHeight(x, z, R, MAX_H) {
  const angle = Math.atan2(z, x);
  const rShape = shapeRadius(angle, R);
  const r = Math.sqrt(x * x + z * z);
  const rNorm = r / rShape;
  const base = Math.max(0, 1 - Math.pow(Math.max(rNorm, 0), 1.7));
  const n1 = fbm(x * 0.035, z * 0.035, 4);
  const n2 = fbm(x * 0.13, z * 0.13, 2);
  let h = base * (MAX_H * (0.65 + 0.55 * n1)) + n2 * 0.9 * base;
  const shoreMask = Math.exp(-Math.pow((rNorm - 0.86) * 6.0, 2));
  h = h * (1 - 0.62 * shoreMask) + 0.35 * shoreMask;
  if (rNorm > 1.0) h = -Math.pow(rNorm - 1.0, 1.3) * 4.0;
  return h;
}
const C_SAND = new THREE.Color(0xe8d5a8);
const C_SAND_WET = new THREE.Color(0xccb98a);
const C_GRASS = new THREE.Color(0x4a7a3a);
const C_GRASS_DARK = new THREE.Color(0x2e5528);
const C_ROCK = new THREE.Color(0x6e6655);
const C_UNDERWATER = new THREE.Color(0xb8a878);

class Island {
  constructor(scene) {
    const { PLANE_SIZE, SEGMENTS, RADIUS, MAX_HEIGHT } = CONFIG.ISLAND;
    const geo = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE, SEGMENTS, SEGMENTS);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      pos.setY(i, islandHeight(x, z, RADIUS, MAX_HEIGHT));
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();

    const normals = geo.attributes.normal;
    const colors = new Float32Array(pos.count * 3);
    const tmp = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      const ny = normals.getY(i);
      const slope = THREE.MathUtils.clamp(1.0 - ny, 0, 1);
      if (y < -0.1) {
        const t = THREE.MathUtils.clamp(-y / 3.0, 0, 1);
        tmp.copy(C_SAND).lerp(C_UNDERWATER, t);
      } else if (y < 0.9) {
        const t = THREE.MathUtils.clamp(y / 0.9, 0, 1);
        tmp.copy(C_SAND_WET).lerp(C_SAND, t);
      } else if (y < 2.2) {
        const t = THREE.MathUtils.clamp((y - 0.9) / 1.3, 0, 1);
        tmp.copy(C_SAND).lerp(C_GRASS, t);
      } else {
        const t = THREE.MathUtils.clamp((y - 2.2) / 6.0, 0, 1);
        tmp.copy(C_GRASS).lerp(C_GRASS_DARK, t);
      }
      if (slope > 0.45) {
        const t = THREE.MathUtils.clamp((slope - 0.45) / 0.4, 0, 1);
        tmp.lerp(C_ROCK, t * 0.8);
      }
      colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.name = 'Island';
    this.mesh.castShadow = true;
    this.mesh.receiveShadow = true;
    scene.add(this.mesh);
  }
  heightAt(x, z) { return islandHeight(x, z, CONFIG.ISLAND.RADIUS, CONFIG.ISLAND.MAX_HEIGHT); }
}

/* --------------------------------------------------------------------------
   DAY / NIGHT CYCLE
-------------------------------------------------------------------------- */
const KEYS = [
  { t:0.00, sky:0x050a14, horizon:0x0a1525, sun:0x223355, sunInt:0.05,
    hemiSky:0x1a2a44, hemiGround:0x0a0a12, hemiInt:0.15, amb:0x223344, ambInt:0.10, fog:0x0a1525, exposure:0.55 },
  { t:0.22, sky:0x1a3560, horizon:0xff6a3a, sun:0xffb27a, sunInt:0.65,
    hemiSky:0x6a88bb, hemiGround:0x33251a, hemiInt:0.35, amb:0x334455, ambInt:0.20, fog:0xffa07a, exposure:0.90 },
  { t:0.30, sky:0x3a78c0, horizon:0xffd9a0, sun:0xfff0d0, sunInt:1.30,
    hemiSky:0x9bc2e8, hemiGround:0x6a5030, hemiInt:0.55, amb:0x556677, ambInt:0.28, fog:0xd9eaf5, exposure:1.00 },
  { t:0.50, sky:0x2a6fbf, horizon:0xbcd9f0, sun:0xfff8e0, sunInt:1.85,
    hemiSky:0x88bbff, hemiGround:0x554433, hemiInt:0.65, amb:0x445566, ambInt:0.32, fog:0xa9d7e8, exposure:1.00 },
  { t:0.70, sky:0x3a78c0, horizon:0xffd9a0, sun:0xffe0b0, sunInt:1.30,
    hemiSky:0x9bc2e8, hemiGround:0x6a5030, hemiInt:0.55, amb:0x556677, ambInt:0.28, fog:0xd9eaf5, exposure:1.00 },
  { t:0.78, sky:0x1a3560, horizon:0xff5a2a, sun:0xff8a5a, sunInt:0.50,
    hemiSky:0x6a88bb, hemiGround:0x33251a, hemiInt:0.32, amb:0x334455, ambInt:0.18, fog:0xff7a4a, exposure:0.85 },
  { t:1.00, sky:0x050a14, horizon:0x0a1525, sun:0x223355, sunInt:0.05,
    hemiSky:0x1a2a44, hemiGround:0x0a0a12, hemiInt:0.15, amb:0x223344, ambInt:0.10, fog:0x0a1525, exposure:0.55 },
];
function lerpKeys(t) {
  let a = KEYS[0], b = KEYS[KEYS.length - 1];
  for (let i = 0; i < KEYS.length - 1; i++) {
    if (t >= KEYS[i].t && t <= KEYS[i + 1].t) { a = KEYS[i]; b = KEYS[i + 1]; break; }
  }
  const span = (b.t - a.t) || 1;
  const k = THREE.MathUtils.clamp((t - a.t) / span, 0, 1);
  const mk = (A, B) => new THREE.Color(A).lerp(new THREE.Color(B), k);
  return {
    sky: mk(a.sky, b.sky), horizon: mk(a.horizon, b.horizon),
    sun: mk(a.sun, b.sun), sunInt: THREE.MathUtils.lerp(a.sunInt, b.sunInt, k),
    hemiSky: mk(a.hemiSky, b.hemiSky), hemiGround: mk(a.hemiGround, b.hemiGround),
    hemiInt: THREE.MathUtils.lerp(a.hemiInt, b.hemiInt, k),
    amb: mk(a.amb, b.amb), ambInt: THREE.MathUtils.lerp(a.ambInt, b.ambInt, k),
    fog: mk(a.fog, b.fog), exposure: THREE.MathUtils.lerp(a.exposure, b.exposure, k),
  };
}

class DayNightCycle {
  constructor(scene, { dayLengthSeconds = 600, startT = 0.35, sky = null, renderer = null } = {}) {
    this.scene = scene; this.sky = sky; this.renderer = renderer;
    this.dayLength = dayLengthSeconds; this.t = startT;

    this.sun = new THREE.DirectionalLight(0xffffff, 1.5);
    this.sun.castShadow = true;
    this.sun.shadow.mapSize.set(CONFIG.RENDERER.SHADOW_MAP_SIZE, CONFIG.RENDERER.SHADOW_MAP_SIZE);
    this.sun.shadow.camera.near = 0.5;
    this.sun.shadow.camera.far = 300;
    this.sun.shadow.camera.left = -80;
    this.sun.shadow.camera.right = 80;
    this.sun.shadow.camera.top = 80;
    this.sun.shadow.camera.bottom = -80;
    this.sun.shadow.bias = -0.0006;
    this.sun.shadow.normalBias = 0.02;
    scene.add(this.sun); scene.add(this.sun.target);

    this.hemi = new THREE.HemisphereLight(0x88bbff, 0x554433, 0.5);
    scene.add(this.hemi);

    this.ambient = new THREE.AmbientLight(0x445566, 0.3);
    scene.add(this.ambient);

    this.sunDirection = new THREE.Vector3(0, 1, 0);
    this.sunColor = new THREE.Color(0xffffff);
    this.update(0);
  }
  update(dt) {
    this.t = (this.t + dt / this.dayLength) % 1;
    if (this.t < 0) this.t += 1;

    const sunAngle = (this.t - 0.25) * Math.PI * 2;
    const r = 200;
    this.sun.position.set(Math.cos(sunAngle) * r, Math.sin(sunAngle) * r, -40);
    this.sun.target.position.set(0, 0, 0);

    const k = lerpKeys(this.t);
    this.sun.color.copy(k.sun); this.sun.intensity = k.sunInt;
    this.hemi.color.copy(k.hemiSky); this.hemi.groundColor.copy(k.hemiGround); this.hemi.intensity = k.hemiInt;
    this.ambient.color.copy(k.amb); this.ambient.intensity = k.ambInt;

    if (this.scene.fog) this.scene.fog.color.copy(k.fog);
    if (this.sky) this.sky.setColors({ top: k.sky, horizon: k.horizon, bottom: k.fog });
    if (this.renderer) this.renderer.toneMappingExposure = k.exposure;

    this.sunDirection.copy(this.sun.position).normalize();
    this.sunColor.copy(k.sun);
  }
  setTimeOfDay(t) { this.t = ((t % 1) + 1) % 1; this.update(0); }
}

/* --------------------------------------------------------------------------
   MOBILE CONTROLS
-------------------------------------------------------------------------- */
class MobileControls {
  constructor() {
    this.root = document.getElementById('mobile-controls');
    this.root.classList.remove('hidden');
    this.root.innerHTML = `
      <div class="joystick-base" id="joy-base"><div class="joystick-knob" id="joy-knob"></div></div>
      <button class="action-btn" id="btn-jump">⤒</button>
      <button class="action-btn" id="btn-action">E</button>`;
    this.move = { x: 0, y: 0 };
    this.jumpPressed = false;
    this.actionPressed = false;
    this._joyId = null;
    this._joyBase = this.root.querySelector('#joy-base');
    this._joyKnob = this.root.querySelector('#joy-knob');
    this._bindJoystick();
    this._bindButtons();
  }
  _bindJoystick() {
    const base = this._joyBase, knob = this._joyKnob, RADIUS = 55;
    const start = (e) => {
      if (this._joyId !== null) return;
      const t = e.changedTouches[0];
      this._joyId = t.identifier;
      const rect = base.getBoundingClientRect();
      this._joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      this._moveJoy(t.clientX, t.clientY, RADIUS, knob);
      e.preventDefault();
    };
    const move = (e) => {
      if (this._joyId === null) return;
      for (const t of e.changedTouches) {
        if (t.identifier === this._joyId) { this._moveJoy(t.clientX, t.clientY, RADIUS, knob); e.preventDefault(); break; }
      }
    };
    const end = (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === this._joyId) {
          this._joyId = null; this.move.x = 0; this.move.y = 0;
          knob.style.transform = 'translate(0,0)';
          e.preventDefault(); break;
        }
      }
    };
    base.addEventListener('touchstart', start, { passive: false });
    base.addEventListener('touchmove', move, { passive: false });
    base.addEventListener('touchend', end, { passive: false });
    base.addEventListener('touchcancel', end, { passive: false });
  }
  _moveJoy(cx, cy, radius, knob) {
    const dx = cx - this._joyCenter.x, dy = cy - this._joyCenter.y;
    const len = Math.hypot(dx, dy) || 1;
    const clamped = Math.min(len, radius);
    const nx = (dx / len) * clamped, ny = (dy / len) * clamped;
    knob.style.transform = `translate(${nx}px, ${ny}px)`;
    this.move.x = nx / radius; this.move.y = -ny / radius;
  }
  _bindButtons() {
    const jump = this.root.querySelector('#btn-jump');
    const action = this.root.querySelector('#btn-action');
    const bindTap = (el, key) => el.addEventListener('touchstart', (e) => { this[key] = true; e.preventDefault(); }, { passive: false });
    bindTap(jump, 'jumpPressed'); bindTap(action, 'actionPressed');
  }
  consumeJump()   { const v = this.jumpPressed; this.jumpPressed = false; return v; }
  consumeAction() { const v = this.actionPressed; this.actionPressed = false; return v; }
}

/* --------------------------------------------------------------------------
   BOOT
-------------------------------------------------------------------------- */
async function boot() {
  const canvas = document.getElementById('game-canvas');
  const loadingScreen = document.getElementById('loading-screen');
  const loadingFill = document.getElementById('loading-fill');
  const loadingText = document.getElementById('loading-text');
  const setProgress = (pct, msg) => {
    if (loadingFill) loadingFill.style.width = `${pct}%`;
    if (loadingText) loadingText.textContent = msg ?? `Loading… ${Math.round(pct)}%`;
  };

  setProgress(5, 'Initializing renderer…');
  const sceneMgr = new SceneManager(canvas);

  setProgress(15, 'Building sky dome…');
  const sky = new Sky(sceneMgr.scene);

  setProgress(30, 'Sculpting island…');
  const island = new Island(sceneMgr.scene);

  setProgress(50, 'Filling lagoon…');
  const ocean = new Ocean(sceneMgr.scene, { shallowRadius: 55, deepRadius: 130 });
  ocean.syncFog(sceneMgr.scene.fog);

  setProgress(60, 'Wiring sun & moon…');
  const dayNight = new DayNightCycle(sceneMgr.scene, {
    dayLengthSeconds: CONFIG.DAY_LENGTH_SECONDS,
    startT: CONFIG.START_TIME_OF_DAY,
    sky, renderer: sceneMgr.renderer,
  });

  const orbit = new OrbitControls(sceneMgr.camera, canvas);
  orbit.target.set(0, 3, 0);
  orbit.maxPolarAngle = Math.PI * 0.49;
  orbit.minDistance = 6;
  orbit.maxDistance = 260;
  orbit.enableDamping = true;
  orbit.dampingFactor = 0.08;
  orbit.update();

  const mobile = IS_MOBILE ? new MobileControls() : null;

  sceneMgr.registerUpdate((dt, elapsed) => {
    dayNight.update(dt);
    ocean.update(dt, elapsed, dayNight.sunDirection, dayNight.sunColor);
    orbit.update();
  });

  setProgress(100, 'Ready');

  setTimeout(() => {
    loadingScreen?.classList.add('hidden');
    sceneMgr.start();
    console.log('%c[HDh. Nolhivaram] Phase 3 live.',
      'color:#35c1c9;font-weight:bold;',
      '\nTry in console: __game.dayNight.setTimeOfDay(0.78)  // sunset',
      '\n                 __game.dayNight.setTimeOfDay(0.00)  // midnight',
      '\n                 __game.dayNight.setTimeOfDay(0.25)  // sunrise');
  }, 300);

  window.__game = { sceneMgr, island, ocean, sky, dayNight, mobile };
}

boot().catch((err) => {
  console.error('[boot] fatal:', err);
  const lt = document.getElementById('loading-text');
  if (lt) lt.textContent = 'Boot failed — see console.';
});
</script>
